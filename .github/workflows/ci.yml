name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  AIRFLOW_VERSION: "3.3.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests airflow && ruff format --check src tests airflow
      - name: sqlfluff (Snowflake migrations)
        run: sqlfluff lint snowflake/migrations --config snowflake/.sqlfluff
      - name: dbt parse
        working-directory: dbt
        run: dbt parse --profiles-dir .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not delta"

  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-4.0.1
      - run: pip install -e ".[dev]"
      - run: pytest -q -m delta --durations=10

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: install Airflow (constrained)
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - name: DAG integrity tests
        run: AIRFLOW_HOME=$(mktemp -d) python -m pytest -q airflow/tests

  e2e:
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-4.0.1
      - run: pip install -e ".[dev]"
      - name: 3 days through lakehouse -> warehouse -> dbt
        run: scripts/e2e.sh 2026-01-01 3
      - name: replay the latest day (an Airflow retry or clear) and check nothing changes
        run: |
          python - <<'PY' > before.txt
          import duckdb; c = duckdb.connect("data/warehouse.duckdb", read_only=True)
          for t in ["marts.fct_claims", "marts.mart_pmpm", "snapshots.snp_members"]:
              print(t, c.execute(f"select count(*) from {t}").fetchone())
          print("paid", c.execute("select sum(net_paid_amount) from marts.fct_claims").fetchone())
          PY
          claims-platform run-day --date 2026-01-03 > /dev/null
          (cd dbt && dbt build --profiles-dir . --quiet)
          python - <<'PY' > after.txt
          import duckdb; c = duckdb.connect("data/warehouse.duckdb", read_only=True)
          for t in ["marts.fct_claims", "marts.mart_pmpm", "snapshots.snp_members"]:
              print(t, c.execute(f"select count(*) from {t}").fetchone())
          print("paid", c.execute("select sum(net_paid_amount) from marts.fct_claims").fetchone())
          PY
          diff before.txt after.txt && cat after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-reports
          path: data/reports
