snapshots:
  - name: snp_members
    description: >
      Member history (SCD2). Line of business and address change over time; PMPM and
      utilization must attribute each month to the plan the member was in *then*.
      The roster date is the effective date, so a replayed or backfilled day produces
      the same history as the original run.
    relation: ref('stg_members')
    config:
      unique_key: member_id
      strategy: check
      check_cols: [line_of_business, zip3, coverage_end]
      updated_at: roster_effective_at
      # terminations arrive as coverage_end (a checked column), so a member dropping
      # off the roster is ignored rather than closed with a wall-clock timestamp
      hard_deletes: ignore
      dbt_valid_to_current: "cast('9999-12-31' as date)"
      post_hook: "{{ apply_governance() }}"
    columns:
      - name: birth_date
        meta: {pii: date_of_birth}
